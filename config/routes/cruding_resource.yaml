cruding_view_token_item_action:
    path: /{resource}/{subject}/{view}/{token}/{item}/{action}
    controller: App\Cruding\Controller\Crud\CrudResourceController
    methods: [GET]
    requirements:
        resource: '[a-z][a-z0-9_-]*'
        subject: '(?!show$|index$|new$|create$|edit$|update$|delete$|bulk$|import$|export$|archive$|restore$|duplicate$|card$|table$|gallery$|compact$|full$|detail$|list$)[A-Za-z0-9][A-Za-z0-9_-]*'
        view: '[a-z0-9][a-z0-9_-]*'
        token: '%cruding.view_token_requirement%'
        item: '[A-Za-z0-9][A-Za-z0-9_-]*'
        action: '(?!request$)[a-z][a-z0-9_-]*'

cruding_view_token_item:
