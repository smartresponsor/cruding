# ---------------------------------------------------------------------------
# Tokenized CRUD delivery route
# ---------------------------------------------------------------------------
# Symfony Router is intentionally kept as a delivery layer only.
# It must not decide whether a URI segment is an operation, identity, slug,
# surface, or business token. Cruding parses the matched path into tokens and
# resolves grammar in PHP through CrudTokenizedRouteIntentResolver.
#
# Canonical examples resolved by Cruding, not by route regex:
#   /vendor/index                         -> resourcePath=vendor, operation=index
#   /vendor/acme-inc                      -> resourcePath=vendor, operation=show, slug=acme-inc
#   /vendor/attachment/media/edit/123     -> resourcePath=vendor/attachment/media, operation=edit, id=123
#   /vendor/document/verify/sample-entry  -> resourcePath=vendor/document, operation=verify, slug=sample-entry
# ---------------------------------------------------------------------------
cruding_tokenized_catch_all:
    path: /{crudPath}
    controller: App\Cruding\Controller\Crud\CrudTokenizedController
    methods: [GET, POST, PUT, PATCH, DELETE]
    defaults:
        _crud_surface: public
    requirements:
        crudPath: '.+'
