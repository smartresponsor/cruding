# ---------------------------------------------------------------------------
# Tokenized API CRUD delivery route
# ---------------------------------------------------------------------------
# API method semantics are resolved in PHP. Route regex only captures the path
# payload after /api/ so Cruding can classify tokens itself.
# ---------------------------------------------------------------------------
cruding_api_tokenized_catch_all:
    path: /api/{crudPath}
    controller: App\Cruding\Controller\Api\Crud\CrudApiController
    methods: [GET, POST, PUT, PATCH, DELETE]
    defaults:
        _crud_surface: public
    requirements:
        crudPath: '%cruding.resource_requirement%(?:/.*)?'
