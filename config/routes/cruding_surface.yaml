cruding_surface_item_action:
    path: /{resource}/{subject}/{surface}/{item}/{action}
    controller: App\Cruding\Controller\Surface\CrudSurfaceController
    methods: [GET]
    requirements:
        resource: '[a-z0-9][a-z0-9_-]*'
        subject: '(?!new$|edit$|delete$)[A-Za-z0-9][A-Za-z0-9_-]*'
        surface: '[a-z0-9][a-z0-9_-]*'
        item: '[A-Za-z0-9][A-Za-z0-9_-]*'
        action: '[a-z][a-z0-9_-]*'

cruding_surface_action:
    path: /{resource}/{subject}/{surface}/{action}
    controller: App\Cruding\Controller\Surface\CrudSurfaceController
    methods: [GET]
    requirements:
        resource: '[a-z0-9][a-z0-9_-]*'
        subject: '(?!new$|edit$|delete$)[A-Za-z0-9][A-Za-z0-9_-]*'
        surface: '[a-z0-9][a-z0-9_-]*'
        action: '[a-z][a-z0-9_-]*'

cruding_surface_index:
    path: /{resource}/{subject}/{surface}
    controller: App\Cruding\Controller\Surface\CrudSurfaceController
    methods: [GET]
    requirements:
        resource: '[a-z0-9][a-z0-9_-]*'
        subject: '(?!new$|edit$|delete$)[A-Za-z0-9][A-Za-z0-9_-]*'
        surface: '[a-z0-9][a-z0-9_-]*'
