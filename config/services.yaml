services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Cruding\Controller\Crud\:
        resource: '../src/Controller/Crud/'
        tags: ['controller.service_arguments']

    App\Cruding\Controller\Api\Crud\:
        resource: '../src/Controller/Api/Crud/'
        tags: ['controller.service_arguments']

    App\Cruding\Service\Crud\:
        resource: '../src/Service/Crud/'
        bind:
            $capabilityMap: '%app.capability_map%'

    App\Cruding\ServiceInterface\Crud\CrudContextResolverInterface: '@App\Cruding\Service\Crud\CrudContextResolver'
    App\Cruding\ServiceInterface\Crud\CrudObjectFinderInterface: '@App\Cruding\Service\Crud\CrudObjectFinder'
    App\Cruding\ServiceInterface\Crud\CrudFormHandlerInterface: '@App\Cruding\Service\Crud\CrudFormHandler'
    App\Cruding\ServiceInterface\Crud\CrudTemplateResolverInterface: '@App\Cruding\Service\Crud\CrudTemplateResolver'
    App\Cruding\ServiceInterface\Crud\CrudRouteNameResolverInterface: '@App\Cruding\Service\Crud\CrudRouteNameResolver'
    App\Cruding\ServiceInterface\Crud\CrudCapabilityResolverInterface: '@App\Cruding\Service\Crud\CrudCapabilityResolver'
    App\Cruding\ServiceInterface\Crud\CrudOwnershipResolverInterface: '@App\Cruding\Service\Crud\CrudOwnershipResolver'
    App\Cruding\ServiceInterface\Crud\CrudAccessContextBuilderInterface: '@App\Cruding\Service\Crud\CrudAccessContextBuilder'
    App\Cruding\ServiceInterface\Crud\CrudMutationGuardInterface: '@App\Cruding\Service\Crud\CrudMutationGuard'
    App\Cruding\ServiceInterface\Crud\CrudApiInputHandlerInterface: '@App\Cruding\Service\Crud\CrudApiInputHandler'
    App\Cruding\ServiceInterface\Crud\CrudApiResponderInterface: '@App\Cruding\Service\Crud\CrudApiResponder'
    App\Cruding\ServiceInterface\Crud\CrudPageDefinitionProviderInterface: '@App\Cruding\Service\Crud\CrudPageDefinitionProvider'

    App\Cruding\Controller\Relation\:
        resource: '../src/Controller/Relation/'
        tags: ['controller.service_arguments']

    App\Cruding\Controller\Api\Relation\:
        resource: '../src/Controller/Api/Relation/'
        tags: ['controller.service_arguments']

    App\Cruding\Service\Relation\:
        resource: '../src/Service/Relation/'

    App\Cruding\ServiceInterface\Relation\ObjectRelationContextResolverInterface: '@App\Cruding\Service\Relation\ObjectRelationContextResolver'
    App\Cruding\ServiceInterface\Relation\ObjectRelationManagerInterface: '@App\Cruding\Service\Relation\ObjectRelationManager'
    App\Cruding\ServiceInterface\Relation\ObjectRelationResponderInterface: '@App\Cruding\Service\Relation\ObjectRelationResponder'

    App\Cruding\Controller\ObjectMeta\:
        resource: '../src/Controller/ObjectMeta/'
        tags: ['controller.service_arguments']

    App\Cruding\Controller\Api\ObjectMeta\:
        resource: '../src/Controller/Api/ObjectMeta/'
        tags: ['controller.service_arguments']

    App\Cruding\Service\ObjectMeta\:
        resource: '../src/Service/ObjectMeta/'
        bind:
            $visibilityTransitions: '%app.object_meta.visibility_transitions%'

    App\Cruding\ServiceInterface\ObjectMeta\ObjectAuditExtractorInterface: '@App\Cruding\Service\ObjectMeta\ObjectAuditExtractor'
    App\Cruding\ServiceInterface\ObjectMeta\ObjectVisibilityManagerInterface: '@App\Cruding\Service\ObjectMeta\ObjectVisibilityManager'

    App\Cruding\Service\Api\ApiProblemResponseFactory: ~
    App\Cruding\EventSubscriber\ApiExceptionSubscriber:
        tags: ['kernel.event_subscriber']
