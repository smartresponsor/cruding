parameters:
    # Route-loader fallbacks.
    # The bundle extension recomputes and overrides these values from runtime scope/entity
    # and config/crud_reserved_token.yaml when the Symfony container is fully built.
    # They must still exist here because imported route YAML resolves %parameters% before
    # any CRUD controller/runtime guard can run.
    cruding.resource_requirement: '[a-z][a-z0-9_-]*'
    cruding.resource_path_requirement: '[a-z][a-z0-9_-]*(?:/[a-z0-9][a-z0-9_-]*)*'
    cruding.view_token_requirement: 'card|table|gallery|compact|full|detail|list'
    cruding.operation_token_requirement: 'show|read|page|index|new|create|edit|update|delete|bulk|import|export|archive|restore|duplicate|assign|unassign|adjust|calculate|verify|reject|approve|pay|recalculate|start|overview|mutation'
    cruding.identity_slug_requirement: '[A-Za-z0-9][A-Za-z0-9_-]*'

    cruding.capability_map:
        identifiable:
            interfaces:
                - App\Cruding\Contract\Capability\CrudIdentifiableInterface
            methods_any: ['getId']
            properties_any: ['id']
        sluggable:
            interfaces:
                - App\Cruding\Contract\Capability\CrudSluggableInterface
            methods_any: ['getSlug']
            properties_any: ['slug']

    cruding.entity_class_alias_map: []
    cruding.form_type_map: []

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Cruding\ServiceInterface\CrudMutationLifecycleSubscriberInterface:
            tags: ['cruding.mutation_lifecycle_subscriber']
        App\Cruding\ServiceInterface\CrudCreateOwnerBinderInterface:
            tags: ['cruding.create_owner_binder']
        App\Cruding\ServiceInterface\CrudOwnershipProviderInterface:
            tags: ['cruding.ownership_provider']
        App\Cruding\ServiceInterface\CrudBulkMutationHandlerInterface:
            tags: ['cruding.bulk_mutation_handler']

    App\Cruding\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Cruding\Controller\CrudResourceController:
        tags: ['controller.service_arguments']
        arguments:
            $routeShapeResolver: '@App\Cruding\Resolver\Resource\CrudRouteShapeResolver'
            $serviceResolver: '@App\Cruding\Resolver\Resource\CrudResourceServiceResolver'
            $serviceInvoker: '@App\Cruding\Service\Resource\CrudResourceServiceInvoker'
            $providerLocator: '@App\Cruding\Service\Resource\CrudResourceProviderLocator'
            $genericFallback: '@App\Cruding\Service\Resource\CrudResourceGenericFallback'
            $notFoundResponseFactory: '@App\Cruding\Factory\CrudNotFoundResponseFactory'
            $debug: '%kernel.debug%'
            $logger: '@?logger'

    App\Cruding\Controller\CrudController:
        public: true
        tags: ['controller.service_arguments']
        arguments:


            $routeMapMatcher: '@App\Cruding\Service\Resource\CrudRouteMapMatcher'


    App\Cruding\Controller\Api\CrudApiController:
        public: true
        tags: ['controller.service_arguments']

    App\Cruding\Command\:
        resource: '../src/Command/'
        exclude:
            - '../src/Command/view/'

    App\Cruding\Builder\:
        resource: '../src/Builder/'

    App\Cruding\Factory\:
        resource: '../src/Factory/'

    App\Cruding\Guard\:
        resource: '../src/Guard/'

    App\Cruding\Service\:
        resource: '../src/Service/'
        exclude:
            - '../src/Service/CrudPassiveService.php'

    App\Cruding\Invoker\:
        resource: '../src/Invoker/'

    App\Cruding\Normalizer\:
        resource: '../src/Normalizer/'

    App\Cruding\Parser\:
        resource: '../src/Parser/'

    App\Cruding\Provider\:
        resource: '../src/Provider/'

    App\Cruding\Responder\:
        resource: '../src/Responder/'

    App\Cruding\Runner\:
        resource: '../src/Runner/'

    App\Cruding\Service\Routing\CrudRouteManifest:
        tags:
            - routing.loader

    App\Cruding\Command\CrudRouteManifestDumpCommand:
        tags:
            - { name: console.command, command: 'crud:route:dump' }

    App\Cruding\Command\CrudRouteManifestValidateCommand:
        tags:
            - { name: console.command, command: 'crud:route:validate' }

    App\Cruding\Service\CrudMutationLifecycleDispatcher:
        arguments:
            $subscriberList: !tagged_iterator cruding.mutation_lifecycle_subscriber

    App\Cruding\Service\CrudCreateOwnerBinderChain:
        arguments:
            $binderList: !tagged_iterator cruding.create_owner_binder

    App\Cruding\Resolver\CrudBulkMutationHandlerResolver:
        arguments:
            $handlers: !tagged_iterator cruding.bulk_mutation_handler

    App\Cruding\Policy\CrudReservedRouteTokenPolicy:
        arguments:
            $viewTokens: '%cruding.runtime_view_tokens%'
            $operationTokens: '%cruding.runtime_operation_tokens%'

    App\Cruding\Service\Resource\CrudResourceProviderLocator:
        arguments:
            $providers: !tagged_iterator cruding.resource_provider

    App\Cruding\ServiceInterface\CrudContextResolverInterface: '@App\Cruding\Resolver\CrudContextResolver'
    App\Cruding\ServiceInterface\CrudObjectFinderInterface: '@App\Cruding\Service\CrudObjectFinder'
    App\Cruding\ServiceInterface\CrudObjectFactoryInterface: '@App\Cruding\Factory\CrudObjectFactory'
    App\Cruding\ServiceInterface\CrudFormHandlerInterface: '@App\Cruding\Handler\CrudFormHandler'
    App\Cruding\ServiceInterface\CrudRouteNameResolverInterface: '@App\Cruding\Resolver\CrudRouteNameResolver'
    App\Cruding\ServiceInterface\CrudCapabilityResolverInterface: '@App\Cruding\Resolver\CrudCapabilityResolver'
    App\Cruding\ServiceInterface\CrudOwnershipResolverInterface: '@App\Cruding\Resolver\CrudOwnershipResolver'
    App\Cruding\ServiceInterface\CrudAccessContextBuilderInterface: '@App\Cruding\Builder\CrudAccessContextBuilder'
    App\Cruding\ServiceInterface\CrudMutationGuardInterface: '@App\Cruding\Guard\CrudMutationGuard'
    App\Cruding\ServiceInterface\CrudApiInputHandlerInterface: '@App\Cruding\Handler\CrudApiInputHandler'
    App\Cruding\ServiceInterface\CrudApiResponderInterface: '@App\Cruding\Responder\CrudApiResponder'
    App\Cruding\ServiceInterface\CrudPageDefinitionProviderInterface: '@App\Cruding\Provider\CrudPageDefinitionProvider'
    App\Cruding\ServiceInterface\Resource\CrudInterfacingProviderResourceBuilderInterface: '@App\Cruding\Builder\Resource\CrudInterfacingProviderResourceBuilder'

    App\Cruding\Handler\:
        resource: '../src/Handler/'

    App\Cruding\Resolver\:
        resource: '../src/Resolver/'

    App\Cruding\Service\Runtime\CrudRuntimeScopeReader:
        arguments:
            $envName: '%cruding.runtime_scope_env%'

    App\Cruding\Service\Runtime\CrudRuntimeEntityReader:
        arguments:
            $envName: '%cruding.runtime_entity_env%'

    App\Cruding\Service\Runtime\CrudRuntimeViewTokenReader:
        arguments:
            $envName: '%cruding.runtime_view_token_env%'

    App\Cruding\Service\Runtime\CrudRuntimeRouteGuard:
        arguments:
            $scopeTokens: '%cruding.runtime_scope_tokens%'
            $entityTokens: '%cruding.runtime_entity_tokens%'
            $viewTokens: '%cruding.runtime_view_tokens%'
            $reservedRootTokens: '%cruding.runtime_reserved_tokens%'
            $operationTokens: '%cruding.runtime_operation_tokens%'
            $resourcePathReservedTokens: '%cruding.runtime_resource_path_reserved_tokens%'
            $allowedResourceTokens: '%cruding.runtime_allowed_resource_tokens%'
            $conflictingEntityTokens: '%cruding.runtime_conflicting_entity_tokens%'
            $resourceRequirement: '%cruding.resource_requirement%'
            $resourcePathRequirement: '%cruding.resource_path_requirement%'
            $viewTokenRequirement: '%cruding.view_token_requirement%'
            $identitySlugRequirement: '%cruding.identity_slug_requirement%'

    App\Cruding\Service\Runtime\CrudRuntimeLockReader:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $appEnv: '%cruding.app_env%'
            $lockGlob: '%cruding.runtime_lock_glob%'

    App\Cruding\Service\Runtime\CrudRuntimeComposerInventoryReader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Cruding\Service\Runtime\CrudRuntimeDecisionGuard:
        arguments:
            $expectedPackageByScopeToken: '%cruding.runtime_scope_package_map%'
            $requireRuntimeLock: '%cruding.runtime_require_lock%'
            $requireComposerPackages: '%cruding.runtime_require_composer_packages%'

    App\Cruding\Factory\Api\CrudApiProblemResponseFactory: ~

    App\Cruding\EventSubscriber\CrudApiExceptionSubscriber:
        tags: ['kernel.event_subscriber']

    App\Cruding\ServiceInterface\Operation\CrudIndexOperationInterface: '@App\Cruding\Service\Operation\CrudIndexOperation'
    App\Cruding\ServiceInterface\Operation\CrudShowOperationInterface: '@App\Cruding\Service\Operation\CrudShowOperation'
    App\Cruding\ServiceInterface\Operation\CrudPageOperationInterface: '@App\Cruding\Service\Operation\CrudPageOperation'
    App\Cruding\ServiceInterface\Operation\CrudBulkOperationInterface: '@App\Cruding\Service\Operation\CrudBulkOperation'
    App\Cruding\ServiceInterface\Operation\CrudCreateOperationInterface: '@App\Cruding\Service\Operation\CrudCreateOperation'
    App\Cruding\ServiceInterface\Operation\CrudEditOperationInterface: '@App\Cruding\Service\Operation\CrudEditOperation'
    App\Cruding\ServiceInterface\Operation\CrudDeleteOperationInterface: '@App\Cruding\Service\Operation\CrudDeleteOperation'

    App\Cruding\ServiceInterface\Operation\CrudApiIndexOperationInterface: '@App\Cruding\Service\Operation\CrudApiIndexOperation'
    App\Cruding\ServiceInterface\Operation\CrudApiShowOperationInterface: '@App\Cruding\Service\Operation\CrudApiShowOperation'
    App\Cruding\ServiceInterface\Operation\CrudApiCreateOperationInterface: '@App\Cruding\Service\Operation\CrudApiCreateOperation'
    App\Cruding\ServiceInterface\Operation\CrudApiUpdateOperationInterface: '@App\Cruding\Service\Operation\CrudApiUpdateOperation'
    App\Cruding\ServiceInterface\Operation\CrudApiDeleteOperationInterface: '@App\Cruding\Service\Operation\CrudApiDeleteOperation'

    App\Cruding\Resolver\CrudOwnershipResolver:
        arguments:
            $providerList: !tagged_iterator cruding.ownership_provider

    App\Cruding\Resolver\CrudCapabilityResolver:
        arguments:
            $capabilityMap: '%cruding.capability_map%'

    App\Cruding\Resolver\CrudEntityClassResolver:
        arguments:
            $entityClassAliasMap: '%cruding.entity_class_alias_map%'

    App\Cruding\Resolver\CrudFormTypeResolver:
        arguments:
            $formTypeMap: '%cruding.form_type_map%'

    App\Cruding\Service\Resource\CrudRouteMapLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $relativeDirectory: 'config/platform/routes'
