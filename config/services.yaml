parameters:
    # Route-loader fallbacks.
    # The bundle extension recomputes and overrides these values from runtime scope/entity
    # and config/cruding_reserved_token.yaml when the Symfony container is fully built.
    # They must still exist here because imported route YAML resolves %parameters% before
    # any CRUD controller/runtime guard can run.
    cruding.resource_requirement: '[a-z][a-z0-9_-]*'
    cruding.resource_path_requirement: '[a-z][a-z0-9_-]*(?:/[a-z0-9][a-z0-9_-]*)*'
    cruding.surface_token_requirement: 'card|table|gallery|compact|full|detail|list'
    cruding.operation_token_requirement: 'show|index|new|create|edit|update|delete|bulk|import|export|archive|restore|duplicate|assign|unassign|adjust|calculate|verify|reject|approve|pay|recalculate|start|overview|mutation'
    cruding.identity_slug_requirement: '[A-Za-z0-9][A-Za-z0-9_-]*'

    cruding.capability_map:
        identifiable:
            interfaces:
                - App\Cruding\Contract\Capability\CrudIdentifiableInterface
            methods_any: ['getId']
            properties_any: ['id']
        sluggable:
            interfaces:
                - App\Cruding\Contract\Capability\CrudSluggableInterface
            methods_any: ['getSlug']
            properties_any: ['slug']

    cruding.entity_class_alias_map: []
    cruding.form_type_map: []

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Cruding\Controller\Crud\:
        resource: '../src/Controller/Crud/'
        tags: ['controller.service_arguments']

    App\Cruding\Controller\Surface\:
        resource: '../src/Controller/Surface/'
        tags: ['controller.service_arguments']
        bind:
            $debug: '%kernel.debug%'

    App\Cruding\Controller\Surface\CrudSurfaceController:
        tags: ['controller.service_arguments']
        arguments:
            $routeShapeResolver: '@App\Cruding\Service\Crud\Surface\CrudRouteShapeResolver'
            $serviceResolver: '@App\Cruding\Service\Crud\Surface\CrudSurfaceServiceResolver'
            $serviceInvoker: '@App\Cruding\Service\Crud\Surface\CrudSurfaceServiceInvoker'
            $providerLocator: '@App\Cruding\Service\Crud\Surface\CrudSurfaceProviderLocator'
            $genericFallback: '@App\Cruding\Service\Crud\Surface\CrudSurfaceGenericFallback'
            $notFoundResponseFactory: '@App\Cruding\Factory\Crud\CrudNotFoundResponseFactory'
            $debug: '%kernel.debug%'
            $logger: '@?logger'

    App\Cruding\Controller\Api\Crud\:
        resource: '../src/Controller/Api/Crud/'
        tags: ['controller.service_arguments']

    App\Cruding\Controller\Crud\CrudController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $routeMapMatcher: '@App\Cruding\Service\Crud\CrudRouteMapMatcher'

    App\Cruding\Controller\Api\Crud\CrudApiController:
        public: true
        tags: ['controller.service_arguments']

    App\Cruding\Command\:
        resource: '../src/Command/'

    App\Cruding\Service\Crud\:
        resource: '../src/Service/Crud/'
        bind:
            $capabilityMap: '%cruding.capability_map%'
            $entityClassAliasMap: '%cruding.entity_class_alias_map%'
            $formTypeMap: '%cruding.form_type_map%'

    App\Cruding\Service\Crud\CrudReservedRouteTokenPolicy:
        arguments:
            $surfaceTokens: '%cruding.runtime_surface_tokens%'
            $operationTokens: '%cruding.runtime_operation_tokens%'

    App\Cruding\Service\Crud\Surface\CrudSurfaceProviderLocator:
        arguments:
            $providers: !tagged_iterator cruding.surface_provider

    App\Cruding\ServiceInterface\Crud\CrudContextResolverInterface: '@App\Cruding\Resolver\Crud\CrudContextResolver'
    App\Cruding\ServiceInterface\Crud\CrudObjectFinderInterface: '@App\Cruding\Service\Crud\CrudObjectFinder'
    App\Cruding\ServiceInterface\Crud\CrudObjectFactoryInterface: '@App\Cruding\Factory\Crud\CrudObjectFactory'
    App\Cruding\ServiceInterface\Crud\CrudFormHandlerInterface: '@App\Cruding\Handler\Crud\CrudFormHandler'
    App\Cruding\ServiceInterface\Crud\CrudRouteNameResolverInterface: '@App\Cruding\Resolver\Crud\CrudRouteNameResolver'
    App\Cruding\ServiceInterface\Crud\CrudCapabilityResolverInterface: '@App\Cruding\Resolver\Crud\CrudCapabilityResolver'
    App\Cruding\ServiceInterface\Crud\CrudOwnershipResolverInterface: '@App\Cruding\Resolver\Crud\CrudOwnershipResolver'
    App\Cruding\ServiceInterface\Crud\CrudAccessContextBuilderInterface: '@App\Cruding\Builder\Crud\CrudAccessContextBuilder'
    App\Cruding\ServiceInterface\Crud\CrudMutationGuardInterface: '@App\Cruding\Guard\Crud\CrudMutationGuard'
    App\Cruding\ServiceInterface\Crud\CrudApiInputHandlerInterface: '@App\Cruding\Handler\Crud\CrudApiInputHandler'
    App\Cruding\ServiceInterface\Crud\CrudApiResponderInterface: '@App\Cruding\Service\Crud\CrudApiResponder'
    App\Cruding\ServiceInterface\Crud\CrudPageDefinitionProviderInterface: '@App\Cruding\Provider\Crud\CrudPageDefinitionProvider'
    App\Cruding\ServiceInterface\Crud\Surface\CrudInterfacingProviderSurfaceBuilderInterface: '@App\Cruding\Service\Crud\Surface\CrudInterfacingProviderSurfaceBuilder'

    App\Cruding\Service\Crud\Runtime\CrudRuntimeScopeReader:
        arguments:
            $envName: '%cruding.runtime_scope_env%'

    App\Cruding\Service\Crud\Runtime\CrudRuntimeEntityReader:
        arguments:
            $envName: '%cruding.runtime_entity_env%'

    App\Cruding\Service\Crud\Runtime\CrudRuntimeSurfaceTokenReader:
        arguments:
            $envName: '%cruding.runtime_surface_token_env%'

    App\Cruding\Service\Crud\Runtime\CrudRuntimeRouteGuard:
        arguments:
            $scopeTokens: '%cruding.runtime_scope_tokens%'
            $entityTokens: '%cruding.runtime_entity_tokens%'
            $surfaceTokens: '%cruding.runtime_surface_tokens%'
            $reservedRootTokens: '%cruding.runtime_reserved_tokens%'
            $operationTokens: '%cruding.runtime_operation_tokens%'
            $resourcePathReservedTokens: '%cruding.runtime_resource_path_reserved_tokens%'
            $allowedResourceTokens: '%cruding.runtime_allowed_resource_tokens%'
            $conflictingEntityTokens: '%cruding.runtime_conflicting_entity_tokens%'
            $resourceRequirement: '%cruding.resource_requirement%'
            $resourcePathRequirement: '%cruding.resource_path_requirement%'
            $surfaceTokenRequirement: '%cruding.surface_token_requirement%'
            $identitySlugRequirement: '%cruding.identity_slug_requirement%'

    App\Cruding\Service\Crud\Runtime\CrudRuntimeLockReader:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $appEnv: '%cruding.app_env%'
            $lockGlob: '%cruding.runtime_lock_glob%'

    App\Cruding\Service\Crud\Runtime\CrudRuntimeComposerInventoryReader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Cruding\Service\Crud\Runtime\CrudRuntimeDecisionGuard:
        arguments:
            $expectedPackageByScopeToken: '%cruding.runtime_scope_package_map%'
            $requireRuntimeLock: '%cruding.runtime_require_lock%'
            $requireComposerPackages: '%cruding.runtime_require_composer_packages%'

    App\Cruding\Service\Crud\Api\CrudApiProblemResponseFactory: ~

    App\Cruding\EventSubscriber\CrudApiExceptionSubscriber:
        tags: ['kernel.event_subscriber']

    App\Cruding\ServiceInterface\Crud\Operation\CrudIndexOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudIndexOperation'
    App\Cruding\ServiceInterface\Crud\Operation\CrudShowOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudShowOperation'
    App\Cruding\ServiceInterface\Crud\Operation\CrudCreateOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudCreateOperation'
    App\Cruding\ServiceInterface\Crud\Operation\CrudEditOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudEditOperation'
    App\Cruding\ServiceInterface\Crud\Operation\CrudDeleteOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudDeleteOperation'

    App\Cruding\ServiceInterface\Crud\Operation\CrudApiIndexOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudApiIndexOperation'
    App\Cruding\ServiceInterface\Crud\Operation\CrudApiShowOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudApiShowOperation'
    App\Cruding\ServiceInterface\Crud\Operation\CrudApiCreateOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudApiCreateOperation'
    App\Cruding\ServiceInterface\Crud\Operation\CrudApiUpdateOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudApiUpdateOperation'
    App\Cruding\ServiceInterface\Crud\Operation\CrudApiDeleteOperationInterface: '@App\Cruding\Service\Crud\Operation\CrudApiDeleteOperation'

    App\Cruding\Service\Crud\Surface\CrudRouteMapLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $relativeDirectory: 'config/platform/routes'
